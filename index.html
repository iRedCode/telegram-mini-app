<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.7); --text: #fafafa; --accent: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0 15px 90px 15px; }
        * { box-sizing: border-box; }

        .tab-content { display: none; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding-top: 20px;}
        .tab-content.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .profile-card { background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .coins-badge { display: inline-block; background: rgba(234, 179, 8, 0.2); color: #eab308; padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 18px; margin-top: 10px; border: 1px solid rgba(234, 179, 8, 0.3); }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        
        .card-visual { position: relative; aspect-ratio: 2/3; border-radius: 12px; background-size: cover; background-position: center; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s; cursor: pointer; }
        .card-visual:active { transform: scale(0.95); }
        .card-visual::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%); z-index: 1; pointer-events: none; }
        .card-info { position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 2; text-align: left; pointer-events: none; }
        .card-name { font-weight: 800; font-size: 12px; margin: 0; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-anime { font-size: 9px; opacity: 0.7; margin: 2px 0 0 0; text-transform: uppercase; }

        .rank-badge { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; border-radius: 6px; z-index: 2; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); pointer-events: none; }
        .rank-S { border: 2px solid #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); } .badge-S { color: #ef4444; }
        .rank-A { border: 2px solid #eab308; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }  .badge-A { color: #eab308; }
        .rank-P { border: 2px solid #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); } .badge-P { color: #a855f7; }
        .rank-D { border: 2px solid #3b82f6; } .badge-D { color: #3b82f6; }
        .rank-E { border: 2px solid #71717a; } .badge-E { color: #71717a; }

        .holo-effect::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.4) 25%, transparent 30%); background-size: 200% 200%; animation: holoShine 3s infinite linear; mix-blend-mode: overlay; }
        @keyframes holoShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .btn-pack { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: none; padding: 20px; font-size: 18px; border-radius: 16px; cursor: pointer; width: 100%; font-weight: 800; text-transform: uppercase; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); }
        .btn-pack:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }

        .creator-form { display: flex; flex-direction: column; gap: 15px; background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .input-field { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 10px; font-size: 16px; outline: none; }
        .input-field:focus { border-color: #ef4444; }
        .file-input { display: none; }
        .file-label { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; text-align: center; border: 1px dashed rgba(255,255,255,0.3); cursor: pointer; color: #a1a1aa; }
        .btn-create { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; }

        /* Общие стили для модальных окон */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 200; justify-content: center; align-items: center; flex-direction: column; }
        .modal-btn { margin-top: 30px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 30px; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* Анимация для окна выпадения новой карты */
        .modal-card-new { width: 60%; max-width: 250px; animation: popCard 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popCard { 0% { transform: scale(0.5) translateY(100px) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) translateY(0) rotate(0); opacity: 1; } }

        /* Стиль для увеличенного просмотра карты (Зум) */
        .modal-card-zoom { width: 85%; max-width: 350px; animation: zoomIn 0.3s ease-out; }
        @keyframes zoomIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { color: #a1a1aa; background: none; border: none; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; width: 20%; cursor: pointer;}
        .nav-item.active { color: #ef4444; transform: translateY(-3px); }
        .nav-icon { font-size: 20px; margin-bottom: 2px;}
    </style>
</head>
<body>

    <div id="tab-profile" class="tab-content active">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Профиль</h2>
        <div class="profile-card">
            <h1 style="font-size: 50px; margin: 0 0 10px 0;">🥷</h1>
            <h2 id="greeting" style="margin: 0; font-size: 22px;">Загрузка...</h2>
            <div class="coins-badge"><span id="coins">...</span> 🪙</div>
        </div>
    </div>

    <div id="tab-shop" class="tab-content">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Магазин</h2>
        <button class="btn-pack" id="openPackBtn" onclick="openPack()">Открыть пак (50 🪙)</button>
    </div>

    <div id="tab-inventory" class="tab-content">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Моя коллекция</h2>
        <div class="cards-grid" id="inventoryList"></div>
    </div>

    <div id="tab-allcards" class="tab-content">
        <h2 style="margin: 0 0 5px 0; font-size: 24px; font-weight: 800;">Справочник</h2>
        <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 20px;">Все карты в игре</p>
        <div class="cards-grid" id="allCardsList"></div>
    </div>

    <div id="tab-create" class="tab-content">
        <h2 style="margin: 0 0 5px 0; font-size: 24px; font-weight: 800;">Студия</h2>
        <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 20px;">Создай свою уникальную карту</p>
        
        <div class="creator-form">
            <input type="text" id="newName" class="input-field" placeholder="Имя персонажа (напр. Гоку)">
            <input type="text" id="newAnime" class="input-field" placeholder="Откуда он? (напр. Dragon Ball)">
            <select id="newRank" class="input-field">
                <option value="E">Ранг E (Обычная)</option>
                <option value="D">Ранг D (Необычная)</option>
                <option value="A">Ранг A (Редкая)</option>
                <option value="S">Ранг S (Эпическая)</option>
                <option value="P">Ранг P (Легендарная)</option>
            </select>
            <label class="file-label">
                <span id="fileNameDisplay">📸 Выбрать картинку...</span>
                <input type="file" id="newImage" class="file-input" accept="image/*" onchange="updateFileName()">
            </label>
            <button class="btn-create" id="submitCardBtn" onclick="createCard()">Выпустить карту!</button>
        </div>
    </div>

    <div class="modal-overlay" id="cardModal" onclick="closeModal('cardModal')">
        <h2 id="modalTitle" style="color: white; margin-bottom: 30px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Высшая редкость!</h2>
        <div class="modal-card-new" id="modalCardRender"></div>
        <button class="modal-btn">Забрать</button>
    </div>

    <div class="modal-overlay" id="viewModal" onclick="closeModal('viewModal')">
        <div class="modal-card-zoom" id="viewCardRender"></div>
        <button class="modal-btn">Закрыть</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('profile', this)"><span class="nav-icon">👤</span>Профиль</button>
        <button class="nav-item" onclick="switchTab('shop', this)"><span class="nav-icon">✨</span>Магазин</button>
        <button class="nav-item" onclick="switchTab('inventory', this)"><span class="nav-icon">🎒</span>Коллекция</button>
        <button class="nav-item" onclick="switchTab('allcards', this)"><span class="nav-icon">📖</span>Каталог</button>
        <button class="nav-item" onclick="switchTab('create', this)"><span class="nav-icon">🎨</span>Студия</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#09090b'); tg.setBackgroundColor('#09090b');

        // !!! ВАЖНО: ТВОЯ ССЫЛКА НА RENDER !!!
        const SERVER_URL = "https://manga-cards-backend.onrender.com"; 
        
        const userId = tg.initDataUnsafe?.user?.id || '123';
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';

        // Глобальный словарь для хранения всех загруженных карт
        let cardsDictionary = {};

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btnElement.classList.add('active');
        }

        // Функция генерирует HTML и добавляет onclick для зума
        function createCardHTML(card, isZoomable = true) {
            // Сохраняем карту в словарь, чтобы потом быстро ее найти по ID
            cardsDictionary[card.id] = card; 
            
            const isHolo = (card.rank === 'S' || card.rank === 'P') ? 'holo-effect' : '';
            // Если карточку можно увеличить, добавляем функцию onclick
            const clickAction = isZoomable ? `onclick="zoomCard(${card.id})"` : '';

            return `
                <div class="card-visual rank-${card.rank} ${isHolo}" style="background-image: url('${card.image}')" ${clickAction}>
                    <div class="rank-badge badge-${card.rank}">${card.rank}</div>
                    <div class="card-info">
                        <p class="card-name">${card.name}</p>
                        <p class="card-anime">${card.anime}</p>
                    </div>
                </div>
            `;
        }

        function renderGrid(containerId, items, emptyMessage) {
            const list = document.getElementById(containerId);
            if (items.length === 0) {
                list.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #71717a; padding: 20px;">${emptyMessage}</p>`;
                return;
            }
            list.innerHTML = items.map(card => createCardHTML(card, true)).join('');
        }

        function closeModal(modalId) { 
            document.getElementById(modalId).style.display = 'none'; 
        }

        // Функция увеличения карты
        function zoomCard(cardId) {
            const card = cardsDictionary[cardId];
            if (card) {
                // Рисуем увеличенную копию без возможности кликнуть на саму себя
                document.getElementById('viewCardRender').innerHTML = createCardHTML(card, false);
                document.getElementById('viewModal').style.display = 'flex';
            }
        }

        async function loadAllCards() {
            try {
                const response = await fetch(`${SERVER_URL}/api/cards`);
                const allCards = await response.json();
                renderGrid('allCardsList', allCards, 'Загрузка...');
            } catch (e) { console.error("Ошибка"); }
        }

        async function login() {
            document.getElementById('greeting').innerText = userName;
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                const data = await response.json();
                document.getElementById('coins').innerText = data.coins;
                renderGrid('inventoryList', data.inventory, 'Пусто. Открой свой первый пак!');
            } catch (e) { console.error("Ошибка логина"); }
        }

        async function openPack() {
            const btn = document.getElementById('openPackBtn');
            btn.disabled = true; btn.innerText = "Открываем...";
            try {
                const response = await fetch(`${SERVER_URL}/api/open_pack`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                const data = await response.json();
                if (data.error) alert(data.error);
                else {
                    document.getElementById('coins').innerText = data.coins;
                    
                    // Устанавливаем заголовок в зависимости от ранга
                    const title = document.getElementById('modalTitle');
                    if(data.newCard.rank === 'S' || data.newCard.rank === 'P') {
                        title.innerText = "Высшая редкость! ✨"; title.style.color = "#a855f7";
                    } else {
                        title.innerText = "Новая карта!"; title.style.color = "white";
                    }

                    document.getElementById('modalCardRender').innerHTML = createCardHTML(data.newCard, false);
                    document.getElementById('cardModal').style.display = 'flex';
                    login(); 
                }
            } catch (e) { alert("Ошибка!"); }
            btn.disabled = false; btn.innerText = "Открыть пак (50 🪙)";
        }

        function updateFileName() {
            const file = document.getElementById('newImage').files[0];
            if (file) document.getElementById('fileNameDisplay').innerText = "✅ " + file.name;
        }

        function createCard() {
            const name = document.getElementById('newName').value;
            const anime = document.getElementById('newAnime').value;
            const rank = document.getElementById('newRank').value;
            const file = document.getElementById('newImage').files[0];

            if (!name || !file) {
                alert("Имя и картинка обязательны!");
                return;
            }

            const btn = document.getElementById('submitCardBtn');
            btn.disabled = true; btn.innerText = "Загрузка...";

            const reader = new FileReader();
            reader.onloadend = async () => {
                const base64String = reader.result; 

                try {
                    const response = await fetch(`${SERVER_URL}/api/create_card`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, anime, rank, image: base64String })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        alert("Карта успешно создана и добавлена в игру!");
                        loadAllCards(); // Обновляем Справочник
                        
                        // Очищаем форму
                        document.getElementById('newName').value = '';
                        document.getElementById('newAnime').value = '';
                        document.getElementById('fileNameDisplay').innerText = "📸 Выбрать картинку...";
                        document.getElementById('newImage').value = '';
                    } else {
                        alert("Сервер ответил ошибкой. Возможно картинка слишком большая.");
                    }
                } catch (e) {
                    alert("Ошибка при создании карты! Проверь лимиты на сервере.");
                }
                btn.disabled = false; btn.innerText = "Выпустить карту!";
            };
            reader.readAsDataURL(file); 
        }

        login();
        loadAllCards();
    </script>
</body>
</html>
