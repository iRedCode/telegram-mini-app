<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --text: #fafafa; --accent: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0 15px 90px 15px; }
        * { box-sizing: border-box; }

        .tab-content { display: none; animation: fadeUp 0.3s ease; padding-top: 20px;}
        .tab-content.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Профиль */
        .profile-card { background: var(--surface); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
        .profile-avatar-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 15px; cursor: pointer; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 3px solid #27272a; background: #27272a; display: flex; align-items: center; justify-content: center; font-size: 50px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: 0.2s;}
        .profile-avatar-wrap:active .profile-avatar { transform: scale(0.95); }
        .edit-badge { position: absolute; bottom: 0; right: 0; background: #3b82f6; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 3px solid var(--surface); }
        
        .coins-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(234, 179, 8, 0.1); color: #eab308; padding: 8px 20px; border-radius: 30px; font-weight: 800; font-size: 18px; margin-top: 5px; border: 1px solid rgba(234, 179, 8, 0.2); }

        /* Витрина лучших карт */
        .best-cards-section { margin-top: 30px; text-align: left; }
        .best-cards-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-add-best { background: transparent; border: 1px dashed #3f3f46; color: #a1a1aa; padding: 5px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .best-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .empty-best { border: 1px dashed #3f3f46; border-radius: 12px; aspect-ratio: 2/3; display: flex; align-items: center; justify-content: center; color: #52525b; font-size: 24px; cursor: pointer; }

        /* Сетки карт (Увеличенные для Каталога и Коллекции) */
        .cards-grid-large { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 15px; }
        /* Мелкая сетка для всплывающих окон выбора */
        .cards-grid-small { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        
        .card-visual { position: relative; aspect-ratio: 2/3; border-radius: 12px; background-size: cover; background-position: center; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s; cursor: pointer; }
        .card-visual:active { transform: scale(0.95); }
        .card-visual::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%); z-index: 1; pointer-events: none; }
        .card-info { position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 2; text-align: left; pointer-events: none; }
        .card-name { font-weight: 800; font-size: 14px; margin: 0; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-anime { font-size: 10px; opacity: 0.7; margin: 3px 0 0 0; text-transform: uppercase; }

        .rank-badge { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; border-radius: 8px; z-index: 2; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); pointer-events: none; }
        .rank-S { border: 2px solid #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); } .badge-S { color: #ef4444; }
        .rank-A { border: 2px solid #eab308; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }  .badge-A { color: #eab308; }
        .rank-P { border: 2px solid #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.5); } .badge-P { color: #a855f7; }
        .rank-D { border: 2px solid #3b82f6; } .badge-D { color: #3b82f6; }
        .rank-E { border: 2px solid #71717a; } .badge-E { color: #71717a; }

        .holo-effect::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.4) 25%, transparent 30%); background-size: 200% 200%; animation: holoShine 3s infinite linear; mix-blend-mode: overlay; }
        @keyframes holoShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Обновленная стильная кнопка магазина */
        .shop-container { display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
        .btn-pack-premium {
            background: linear-gradient(145deg, #18181b, #27272a); color: #fafafa; border: 1px solid rgba(255,255,255,0.1);
            padding: 25px 30px; font-size: 18px; border-radius: 24px; cursor: pointer; width: 100%; max-width: 300px;
            font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.05); transition: 0.2s; position: relative; overflow: hidden;
        }
        .btn-pack-premium:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-pack-premium::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%); opacity: 0; transition: 0.3s; }
        .btn-pack-premium:active::before { opacity: 1; }
        .pack-price { color: #eab308; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

        .creator-form { display: flex; flex-direction: column; gap: 15px; background: var(--surface); padding: 20px; border-radius: 15px; }
        .input-field { background: #09090b; border: 1px solid #27272a; color: white; padding: 15px; border-radius: 10px; font-size: 16px; outline: none; }
        .input-field:focus { border-color: #3b82f6; }
        .file-input { display: none; }
        .file-label { background: #27272a; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; color: #a1a1aa; }
        .btn-create { background: #fafafa; color: #09090b; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; }

        /* Модальные окна */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 200; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .modal-btn { margin-top: 30px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 30px; border-radius: 20px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .modal-card-new { width: 70%; max-width: 280px; animation: popCard 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-card-zoom { width: 85%; max-width: 350px; animation: zoomIn 0.3s ease-out; }
        
        /* Модалка для выбора карты (Скроллируемая) */
        .selector-container { width: 100%; max-width: 400px; max-height: 70vh; overflow-y: auto; background: var(--surface); padding: 20px; border-radius: 20px; }
        
        @keyframes popCard { 0% { transform: scale(0.5) translateY(100px) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) translateY(0) rotate(0); opacity: 1; } }
        @keyframes zoomIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid #27272a; z-index: 100; }
        .nav-item { color: #71717a; background: none; border: none; font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; width: 20%; cursor: pointer;}
        .nav-item.active { color: #fafafa; transform: translateY(-3px); }
        .nav-icon { font-size: 20px; margin-bottom: 2px;}
    </style>
</head>
<body>

    <div id="tab-profile" class="tab-content active">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Профиль</h2>
        <div class="profile-card">
            <div class="profile-avatar-wrap" onclick="openSelector('avatar')">
                <img id="profileAvatar" class="profile-avatar" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="🥷" onerror="this.style.display='none'; document.getElementById('avatarFallback').style.display='flex';">
                <div id="avatarFallback" class="profile-avatar" style="position: absolute; top:0; left:0; display:flex;">🥷</div>
                <div class="edit-badge">✏️</div>
            </div>
            <h2 id="greeting" style="margin: 0; font-size: 22px;">Загрузка...</h2>
            <div class="coins-badge"><span id="coins">...</span> 🪙</div>
        </div>

        <div class="best-cards-section">
            <div class="best-cards-header">
                <h3 style="margin:0;">Лучшие карты</h3>
                <button class="btn-add-best" onclick="openSelector('best')">+ Добавить</button>
            </div>
            <div class="best-cards-grid" id="bestCardsRender">
                <div class="empty-best" onclick="openSelector('best')">+</div>
                <div class="empty-best" onclick="openSelector('best')">+</div>
                <div class="empty-best" onclick="openSelector('best')">+</div>
            </div>
        </div>
    </div>

    <div id="tab-shop" class="tab-content">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Магазин</h2>
        <div class="shop-container">
            <button class="btn-pack-premium" id="openPackBtn" onclick="openPack()">
                <span>Стандартный Пак</span>
                <span class="pack-price">50 🪙</span>
            </button>
            <p style="color: #71717a; font-size: 12px; margin-top: 15px; text-align: center;">Гарантированная карта внутри.<br>Шанс на ранг S и P!</p>
        </div>
    </div>

    <div id="tab-inventory" class="tab-content">
        <h2 style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;">Моя коллекция</h2>
        <div class="cards-grid-large" id="inventoryList"></div>
    </div>

    <div id="tab-allcards" class="tab-content">
        <h2 style="margin: 0 0 5px 0; font-size: 24px; font-weight: 800;">Справочник</h2>
        <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 20px;">Все карты в игре</p>
        <div class="cards-grid-large" id="allCardsList"></div>
    </div>

    <div id="tab-create" class="tab-content">
        <h2 style="margin: 0 0 5px 0; font-size: 24px; font-weight: 800;">Студия</h2>
        <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 20px;">Создай свою уникальную карту</p>
        <div class="creator-form">
            <input type="text" id="newName" class="input-field" placeholder="Имя персонажа">
            <input type="text" id="newAnime" class="input-field" placeholder="Откуда он?">
            <select id="newRank" class="input-field">
                <option value="E">Ранг E (Обычная)</option>
                <option value="D">Ранг D (Необычная)</option>
                <option value="A">Ранг A (Редкая)</option>
                <option value="S">Ранг S (Эпическая)</option>
                <option value="P">Ранг P (Легендарная)</option>
            </select>
            <label class="file-label">
                <span id="fileNameDisplay">📸 Выбрать картинку...</span>
                <input type="file" id="newImage" class="file-input" accept="image/*" onchange="updateFileName()">
            </label>
            <button class="btn-create" id="submitCardBtn" onclick="createCard()">Выпустить карту</button>
        </div>
    </div>

    <div class="modal-overlay" id="cardModal" onclick="closeModal('cardModal')">
        <h2 id="modalTitle" style="color: white; margin-bottom: 30px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Высшая редкость!</h2>
        <div class="modal-card-new" id="modalCardRender"></div>
        <button class="modal-btn">Забрать</button>
    </div>

    <div class="modal-overlay" id="viewModal" onclick="closeModal('viewModal')">
        <div class="modal-card-zoom" id="viewCardRender"></div>
        <button class="modal-btn" id="removeBestBtn" style="display:none; background:#ef4444; border:none;">Убрать с витрины</button>
        <button class="modal-btn">Закрыть</button>
    </div>

    <div class="modal-overlay" id="selectorModal">
        <div class="selector-container">
            <h3 id="selectorTitle" style="margin-top:0;">Выберите карту</h3>
            <div class="cards-grid-small" id="selectorList"></div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="modal-btn" style="margin-top:0;" onclick="closeModal('selectorModal')">Отмена</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('profile', this)"><span class="nav-icon">👤</span>Профиль</button>
        <button class="nav-item" onclick="switchTab('shop', this)"><span class="nav-icon">✨</span>Магазин</button>
        <button class="nav-item" onclick="switchTab('inventory', this)"><span class="nav-icon">🎒</span>Коллекция</button>
        <button class="nav-item" onclick="switchTab('allcards', this)"><span class="nav-icon">📖</span>Каталог</button>
        <button class="nav-item" onclick="switchTab('create', this)"><span class="nav-icon">🎨</span>Студия</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#09090b'); tg.setBackgroundColor('#09090b');

        // !!! ВАЖНО: ТВОЯ ССЫЛКА НА RENDER !!!
        const SERVER_URL = "https://manga-cards-backend.onrender.com"; 
        
        const userId = tg.initDataUnsafe?.user?.id || '123';
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';

        let cardsDictionary = {};
        let currentUserData = null;
        let currentSelectorMode = ''; // 'avatar' или 'best'

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btnElement.classList.add('active');
        }

        function createCardHTML(card, clickActionStr = '') {
            cardsDictionary[card.id] = card; 
            const isHolo = (card.rank === 'S' || card.rank === 'P') ? 'holo-effect' : '';
            return `
                <div class="card-visual rank-${card.rank} ${isHolo}" style="background-image: url('${card.image}')" ${clickActionStr}>
                    <div class="rank-badge badge-${card.rank}">${card.rank}</div>
                    <div class="card-info">
                        <p class="card-name">${card.name}</p>
                        <p class="card-anime">${card.anime}</p>
                    </div>
                </div>
            `;
        }

        function renderGrid(containerId, items, emptyMessage, clickActionTemplate = "zoomCard({id})") {
            const list = document.getElementById(containerId);
            if (items.length === 0) {
                list.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #71717a; padding: 20px;">${emptyMessage}</p>`;
                return;
            }
            list.innerHTML = items.map(card => {
                const action = `onclick="${clickActionTemplate.replace('{id}', card.id)}"`;
                return createCardHTML(card, action);
            }).join('');
        }

        function closeModal(modalId) { 
            document.getElementById(modalId).style.display = 'none'; 
        }

        function zoomCard(cardId, isFromBest = false) {
            const card = cardsDictionary[cardId];
            if (card) {
                document.getElementById('viewCardRender').innerHTML = createCardHTML(card, "");
                
                // Кнопка удаления, если смотрим с витрины
                const removeBtn = document.getElementById('removeBestBtn');
                if (isFromBest) {
                    removeBtn.style.display = 'inline-block';
                    removeBtn.onclick = (e) => { e.stopPropagation(); updateProfile('remove_best', card.id); closeModal('viewModal'); };
                } else {
                    removeBtn.style.display = 'none';
                }

                document.getElementById('viewModal').style.display = 'flex';
            }
        }

        // Открытие меню выбора карты для Аватара или Витрины
        function openSelector(mode) {
            if (!currentUserData || currentUserData.inventory.length === 0) {
                alert("У вас пока нет карт! Откройте пак в магазине.");
                return;
            }
            currentSelectorMode = mode;
            document.getElementById('selectorTitle').innerText = mode === 'avatar' ? "Выберите аватар" : "Добавить на витрину";
            
            // Рисуем инвентарь в модалке, но по клику вызываем selectCard()
            renderGrid('selectorList', currentUserData.inventory, '', "selectCard({id})");
            document.getElementById('selectorModal').style.display = 'flex';
        }

        function selectCard(cardId) {
            const card = cardsDictionary[cardId];
            if (currentSelectorMode === 'avatar') {
                updateProfile('set_avatar', card.image);
            } else if (currentSelectorMode === 'best') {
                updateProfile('add_best', card);
            }
            closeModal('selectorModal');
        }

        // Отправка данных профиля на сервер
        async function updateProfile(action, payload) {
            try {
                const response = await fetch(`${SERVER_URL}/api/update_profile`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId, action, payload })
                });
                const data = await response.json();
                if (data.success) {
                    currentUserData = data.user;
                    updateProfileUI(); // Обновляем экран без полной перезагрузки
                }
            } catch (e) { alert("Ошибка сохранения!"); }
        }

        // Обновление интерфейса профиля
        function updateProfileUI() {
            if (!currentUserData) return;
            
            // Аватар
            if (currentUserData.avatar) {
                document.getElementById('profileAvatar').src = currentUserData.avatar;
                document.getElementById('profileAvatar').style.display = 'block';
                document.getElementById('avatarFallback').style.display = 'none';
            }

            // Лучшие карты
            const bestContainer = document.getElementById('bestCardsRender');
            bestContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (currentUserData.bestCards[i]) {
                    // Передаем true, чтобы знать, что клик был с витрины (для кнопки удаления)
                    const action = `onclick="zoomCard(${currentUserData.bestCards[i].id}, true)"`;
                    bestContainer.innerHTML += createCardHTML(currentUserData.bestCards[i], action);
                } else {
                    bestContainer.innerHTML += `<div class="empty-best" onclick="openSelector('best')">+</div>`;
                }
            }
        }

        async function loadAllCards() {
            try {
                const response = await fetch(`${SERVER_URL}/api/cards`);
                const allCards = await response.json();
                renderGrid('allCardsList', allCards, 'Загрузка...');
            } catch (e) {}
        }

        async function login() {
            document.getElementById('greeting').innerText = userName;
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                currentUserData = await response.json();
                document.getElementById('coins').innerText = currentUserData.coins;
                renderGrid('inventoryList', currentUserData.inventory, 'Пусто. Открой свой первый пак!');
                updateProfileUI(); // Рисуем аватар и витрину
            } catch (e) { console.error("Ошибка логина"); }
        }

        async function openPack() {
            const btn = document.getElementById('openPackBtn');
            btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
            try {
                const response = await fetch(`${SERVER_URL}/api/open_pack`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                const data = await response.json();
                if (data.error) alert(data.error);
                else {
                    const title = document.getElementById('modalTitle');
                    if(data.newCard.rank === 'S' || data.newCard.rank === 'P') {
                        title.innerText = "Высшая редкость! ✨"; title.style.color = "#a855f7";
                    } else {
                        title.innerText = "Новая карта!"; title.style.color = "white";
                    }
                    document.getElementById('modalCardRender').innerHTML = createCardHTML(data.newCard, "");
                    document.getElementById('cardModal').style.display = 'flex';
                    login(); 
                }
            } catch (e) { alert("Ошибка!"); }
            btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
        }

        function updateFileName() {
            const file = document.getElementById('newImage').files[0];
            if (file) document.getElementById('fileNameDisplay').innerText = "✅ " + file.name;
        }

        function createCard() {
            const name = document.getElementById('newName').value;
            const anime = document.getElementById('newAnime').value;
            const rank = document.getElementById('newRank').value;
            const file = document.getElementById('newImage').files[0];
            if (!name || !file) { alert("Имя и картинка обязательны!"); return; }

            const btn = document.getElementById('submitCardBtn');
            btn.innerText = "Загрузка...";

            const reader = new FileReader();
            reader.onloadend = async () => {
                try {
                    const response = await fetch(`${SERVER_URL}/api/create_card`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, anime, rank, image: reader.result })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert("Карта добавлена в игру!");
                        loadAllCards();
                        document.getElementById('newName').value = ''; document.getElementById('newAnime').value = '';
                        document.getElementById('fileNameDisplay').innerText = "📸 Выбрать картинку..."; document.getElementById('newImage').value = '';
                    }
                } catch (e) { alert("Ошибка!"); }
                btn.innerText = "Выпустить карту";
            };
            reader.readAsDataURL(file); 
        }

        login(); loadAllCards();
    </script>
</body>
</html>
