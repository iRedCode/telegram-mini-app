<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e2f; color: white; padding: 20px; text-align: center; }
        .profile { background: #2a2a40; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .btn-pack { background: #ff4757; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;}
        .btn-pack:active { background: #ff6b81; transform: scale(0.98); }
        .result-card { margin-top: 20px; background: #3742fa; padding: 20px; border-radius: 10px; display: none; animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="profile">
        <h2 id="greeting">Загрузка...</h2>
        <p>Баланс: <span id="coins">...</span> 🪙</p>
    </div>

    <button class="btn-pack" id="openPackBtn" onclick="openPack()">Открыть пак (50 🪙)</button>

    <div class="result-card" id="cardResult">
        <h3>Вам выпала карточка!</h3>
        <h1 id="cardEmoji">✨</h1>
        <h2 id="cardName">Название</h2>
        <p id="cardRarity">Редкость</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВАЖНО: Вставь сюда ссылку на свой сервер с Render.com (без слеша на конце)
        const SERVER_URL = "https://manga-cards-backend.onrender.com"; 
        
        // Получаем ID пользователя (если открыли в браузере, ставим заглушку '123')
        const userId = tg.initDataUnsafe?.user?.id || '123';
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';

        // 1. При загрузке страницы логинимся на сервере
        async function login() {
            document.getElementById('greeting').innerText = `Привет, ${userName}!`;
            
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                const data = await response.json();
                document.getElementById('coins').innerText = data.coins;
            } catch (e) {
                alert("Ошибка подключения к серверу!");
            }
        }

        // 2. Функция покупки пака
        async function openPack() {
            const btn = document.getElementById('openPackBtn');
            btn.disabled = true;
            btn.innerText = "Открываем...";

            try {
                const response = await fetch(`${SERVER_URL}/api/open_pack`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userId })
                });
                
                const data = await response.json();

                if (data.error) {
                    alert(data.error); // Например "Недостаточно монет"
                } else {
                    // Обновляем монеты
                    document.getElementById('coins').innerText = data.coins;
                    
                    // Показываем выпавшую карту
                    const resultDiv = document.getElementById('cardResult');
                    document.getElementById('cardEmoji').innerText = data.newCard.emoji;
                    document.getElementById('cardName').innerText = data.newCard.name;
                    document.getElementById('cardRarity').innerText = data.newCard.rarity;
                    
                    resultDiv.style.display = 'block';
                }
            } catch (e) {
                alert("Ошибка при открытии пака!");
            }

            btn.disabled = false;
            btn.innerText = "Открыть пак (50 🪙)";
        }

        // Запускаем логин при старте
        login();
    </script>
</body>
</html>
